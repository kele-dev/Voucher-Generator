# /etc/nginx/sites-available/voucher  — example, adjust server_name/paths.
# TLS via certbot: sudo certbot --nginx -d voucher.example.com

server {
    listen 80;
    server_name voucher.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name voucher.example.com;

    # Only public/ is web-served. Database, storage, backups, .env stay outside.
    root /var/www/voucher/current/public;
    index index.php;

    # ssl_certificate / ssl_certificate_key are added by certbot.

    # Template uploads are capped at 10 MB by the app; leave headroom.
    client_max_body_size 12m;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        # Voucher previews and single downloads render on demand.
        fastcgi_read_timeout 60s;
    }

    # Hashed build assets can be cached forever.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
