; /etc/supervisor/conf.d/voucher-worker.conf — example.
; sudo supervisorctl reread && sudo supervisorctl update
;
; One worker is enough for SQLite: more workers only contend for the single
; write lock. --timeout must be below DB_QUEUE_RETRY_AFTER (2000) and above
; the longest job (export: 1800s). stopwaitsecs lets a running export finish
; on deploy instead of being killed mid-ZIP.

[program:voucher-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/voucher/current/artisan queue:work database --sleep=2 --tries=3 --timeout=1850 --max-time=3600
directory=/var/www/voucher/current
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=1900
redirect_stderr=true
stdout_logfile=/var/www/voucher/shared/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
